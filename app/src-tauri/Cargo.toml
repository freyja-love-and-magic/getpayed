[package]
name = "gelder"
version = "0.1.0"
description = "Gelder — create an invoice, share it, get paid online"
authors = ["Planet Nine"]
edition = "2021"

[lib]
name = "gelder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-share-sheet = { path = "tauri-plugin-share-sheet" }
tauri-plugin-app-group = { path = "tauri-plugin-app-group" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bdo-rs = { path = "../../../allyabase/deployment/bdo/src/client/rust/bdo-rs" }
addie-rs = { path = "../../../allyabase/deployment/addie/src/client/rust/addie-rs" }
sessionless = "0.1.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
